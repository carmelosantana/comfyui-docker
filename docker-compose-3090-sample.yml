name: comfyui-docker

# Opinionated sample for Carmelo's TrueNAS box (single RTX 3090, 24GB).
# A 1:1 replacement for the old lecode stack: only the image owner changed, plus a
# research-backed 3090 command/env. Drop this into Portainer over the old stack.
services:
  comfyui:
    image: ghcr.io/carmelosantana/comfyui-docker:${IMAGE_TAG:-latest}
    container_name: comfyui-lecode
    restart: unless-stopped
    extra_hosts:
      - "ollama:host-gateway"
    environment:
      USER_ID: "${USER_ID:-1000}"
      GROUP_ID: "${GROUP_ID:-1000}"
      PYTORCH_ALLOC_CONF: "expandable_segments:True"
      # ComfyUI-Manager v4 API posture (enforced into config.ini each boot). personal_cloud+normal
      # unlocks node/model installs for ComfyUI-MCP on this 0.0.0.0 LAN box; set network_mode=public
      # to lock down if the box is ever exposed publicly.
      MANAGER_NETWORK_MODE: "${MANAGER_NETWORK_MODE:-personal_cloud}"
      MANAGER_SECURITY_LEVEL: "${MANAGER_SECURITY_LEVEL:-normal}"
      # Lazy-download caches for model weights (TTS engines, HuggingFace, torch hub). Kept inside
      # the models mount so first-use downloads survive a container recreate. Override to relocate.
      HF_HOME: "${HF_HOME:-/opt/comfyui/models/.cache/huggingface}"
      TORCH_HOME: "${TORCH_HOME:-/opt/comfyui/models/.cache/torch}"
      # Baked node packs are seeded into custom_nodes on boot, ON BY DEFAULT. Set SEED_BAKED_NODES=0
      # to disable all seeding, or a category flag to 0 to skip just that group (audio=TTS,
      # video=Wan/VideoHelper/Frame-Interpolation, helper=KJNodes/essentials/HF-Downloader).
      SEED_BAKED_NODES: "${SEED_BAKED_NODES:-1}"
      SEED_AUDIO_NODES: "${SEED_AUDIO_NODES:-1}"
      SEED_VIDEO_NODES: "${SEED_VIDEO_NODES:-1}"
      SEED_HELPER_NODES: "${SEED_HELPER_NODES:-1}"
    ports:
      - "8188:8188"
    volumes:
      - ${MODELS_PATH:-/mnt/Data/ComfyUI/models}:/opt/comfyui/models:rw
      - ${CUSTOM_NODES_PATH:-/mnt/Data/ComfyUI/custom_nodes}:/opt/comfyui/custom_nodes:rw
      - ${OUTPUT_PATH:-/mnt/Data/ComfyUI/output}:/opt/comfyui/output:rw
      - ${INPUT_PATH:-/mnt/Data/ComfyUI/input}:/opt/comfyui/input:rw
      - ${WORKFLOWS_PATH:-/mnt/Data/ComfyUI/user/default/workflows}:/opt/comfyui/user/default/workflows:rw
    command:
      - "--use-pytorch-cross-attention"
      - "--reserve-vram"
      - "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
