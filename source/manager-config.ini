[default]
# Unlocks ComfyUI-Manager v4's install/model management API for programmatic control
# (ComfyUI-MCP). personal_cloud is required because the container listens on 0.0.0.0
# (non-loopback); normal is the least-permissive security_level that still allows arbitrary
# git-URL node installs and arbitrary-URL model downloads. Override via MANAGER_NETWORK_MODE /
# MANAGER_SECURITY_LEVEL. Set network_mode=public to lock the box down when exposed publicly.
security_level = normal
network_mode = personal_cloud
