name: comfyui-docker

# Opinionated sample for Carmelo's TrueNAS box (single RTX 3090, 24GB) — SageAttention build.
# Identical to docker-compose-3090-sample.yml except it runs the -sage image (sage attention on
# by default) and drops --use-pytorch-cross-attention (sage replaces it). Drop into Portainer
# over the old stack. To A/B against the base attention backend, set USE_SAGE_ATTENTION: "0".
services:
  comfyui:
    image: ghcr.io/carmelosantana/comfyui-docker:${IMAGE_TAG:-latest-sage}
    container_name: comfyui-lecode
    restart: unless-stopped
    extra_hosts:
      - "ollama:host-gateway"
    environment:
      USER_ID: "${USER_ID:-1000}"
      GROUP_ID: "${GROUP_ID:-1000}"
      PYTORCH_ALLOC_CONF: "expandable_segments:True"
      USE_SAGE_ATTENTION: "${USE_SAGE_ATTENTION:-1}"
    ports:
      - "8188:8188"
    volumes:
      - ${MODELS_PATH:-/mnt/Data/ComfyUI/models}:/opt/comfyui/models:rw
      - ${CUSTOM_NODES_PATH:-/mnt/Data/ComfyUI/custom_nodes}:/opt/comfyui/custom_nodes:rw
      - ${OUTPUT_PATH:-/mnt/Data/ComfyUI/output}:/opt/comfyui/output:rw
      - /mnt/Data/ComfyUI/input:/opt/comfyui/input:rw
      - /mnt/Data/ComfyUI/user/default/workflows:/opt/comfyui/user/default/workflows:rw
    command:
      - "--reserve-vram"
      - "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
